name: Build NeoForge Mod (1.21.1)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Чтобы запускать сборку кнопкой вручную

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'microsoft' # NeoForge официально рекомендует сборку от Microsoft

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Mod
      # Флаг --no-daemon экономит оперативную память в облаке GitHub
      run: ./gradlew build --no-daemon

    - name: Upload Mod Jar
      uses: actions/upload-artifact@v4
      with:
        name: neoforge-mod-1.21.1
        path: build/libs/*.jar
